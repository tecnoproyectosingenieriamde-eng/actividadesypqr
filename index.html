<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador PDF a Sheets</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        /* NUEVO: Actualizado a 3 columnas */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .drop-zone { border: 2px dashed #007bff; padding: 30px; text-align: center; color: #007bff; cursor: pointer; border-radius: 8px; }
        .drop-zone:hover { background-color: #f0f8ff; }
        .drop-zone.actividades { border-color: #28a745; color: #28a745; }
        .drop-zone.actividades:hover { background-color: #eafaf1; }
        /* NUEVO: Estilos para la zona de Tabla */
        .drop-zone.tabla { border-color: #17a2b8; color: #17a2b8; }
        .drop-zone.tabla:hover { background-color: #e0f7fa; }
        
        #status { margin-top: 15px; font-weight: bold; text-align: center; padding: 10px;}
        button { color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; width: 100%; font-size: 16px; margin-top: 10px;}
        .btn-pqr { background: #007bff; }
        .btn-act { background: #28a745; }
        /* NUEVO: Botón Tabla */
        .btn-tabla { background: #17a2b8; }
        
        button:disabled { background: #ccc !important; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align: center;">Extractor de PDFs para Sheets</h2>
    
    <div class="grid">
        <!-- ZONA PQR -->
        <div>
            <h3 style="color:#007bff">1. Cargar PQRS</h3>
            <div class="drop-zone" id="dropZonePQR">
                Arrastra PDFs de PQRS aquí
                <input type="file" id="fileInputPQR" multiple accept="application/pdf" style="display: none;">
            </div>
            <button id="btnProcesarPQR" class="btn-pqr" disabled>Procesar PQR</button>
        </div>
        <!-- ZONA ACTIVIDADES -->
        <div>
            <h3 style="color:#28a745">2. Cargar Cronograma</h3>
            <div class="drop-zone actividades" id="dropZoneAct">
                Arrastra el PDF del Cronograma aquí
                <input type="file" id="fileInputAct" multiple accept="application/pdf" style="display: none;">
            </div>
            <button id="btnProcesarAct" class="btn-act" disabled>Procesar Actividades</button>
        </div>
        <!-- ZONA TABLA (NUEVO) -->
        <div>
            <h3 style="color:#17a2b8">3. Cargar Tabla Diaria</h3>
            <div class="drop-zone tabla" id="dropZoneTabla">
                Arrastra PDF de Tabla aquí
                <input type="file" id="fileInputTabla" multiple accept="application/pdf" style="display: none;">
            </div>
            <button id="btnProcesarTabla" class="btn-tabla" disabled>Procesar Tabla</button>
        </div>
    </div>
    <div id="status"></div>
</div>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    // ======== LÓGICA DE INTERFAZ ========
    const dropZonePQR = document.getElementById('dropZonePQR');
    const fileInputPQR = document.getElementById('fileInputPQR');
    const btnProcesarPQR = document.getElementById('btnProcesarPQR');
    
    const dropZoneAct = document.getElementById('dropZoneAct');
    const fileInputAct = document.getElementById('fileInputAct');
    const btnProcesarAct = document.getElementById('btnProcesarAct');

    // NUEVO: Variables para Tabla
    const dropZoneTabla = document.getElementById('dropZoneTabla');
    const fileInputTabla = document.getElementById('fileInputTabla');
    const btnProcesarTabla = document.getElementById('btnProcesarTabla');
    
    const statusDiv = document.getElementById('status');
    
    let archivosPQR = [];
    let archivosAct = [];
    let archivosTabla = []; // NUEVO
    
    // Setup PQR
    dropZonePQR.addEventListener('click', () => fileInputPQR.click());
    fileInputPQR.addEventListener('change', (e) => {
        archivosPQR = Array.from(e.target.files);
        btnProcesarPQR.disabled = archivosPQR.length === 0;
        statusDiv.innerText = `${archivosPQR.length} PDFs de PQR listos.`;
    });
    
    // Setup Actividades
    dropZoneAct.addEventListener('click', () => fileInputAct.click());
    fileInputAct.addEventListener('change', (e) => {
        archivosAct = Array.from(e.target.files);
        btnProcesarAct.disabled = archivosAct.length === 0;
        statusDiv.innerText = `${archivosAct.length} PDFs de Actividades listos.`;
    });

    // NUEVO: Setup Tabla
    dropZoneTabla.addEventListener('click', () => fileInputTabla.click());
    fileInputTabla.addEventListener('change', (e) => {
        archivosTabla = Array.from(e.target.files);
        btnProcesarTabla.disabled = archivosTabla.length === 0;
        statusDiv.innerText = `${archivosTabla.length} PDFs de Tabla listos.`;
    });

    async function extractTextFromPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let text = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            
            let lastY = -1;
            content.items.forEach(item => {
                let currentY = Math.round(item.transform[5]); 
                if (lastY !== -1 && Math.abs(lastY - currentY) > 3) {
                    text += '\n';
                }
                text += item.str.trim() + ' ';
                lastY = currentY;
            });
            text += '\n';
        }
        console.log("TEXTO CRUDO EXTRAÍDO DEL PDF:\n", text);
        return text;
    }

    // ======== PARSEADORES EXISTENTES ========
    function parsearPQR(texto) {
        let resultado = { mes: "", fechaRadicado: "", nombre: "", cc: "", tel: "", direccion: "", barrio: "", ordenServicio: "", fechaRespuesta: "" };
        
        const matchFecha = texto.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
        if (matchFecha) {
            resultado.fechaRadicado = matchFecha[0];
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            resultado.mes = meses[parseInt(matchFecha[2], 10) - 1]; 
        }
        const matchFechaServicio = texto.match(/FECHA SERVICIO\s*(\d{2}\/\d{2}\/\d{4})/i);
        if (matchFechaServicio) resultado.fechaRespuesta = matchFechaServicio[1];
        const matchOrden = texto.match(/(?:ORDEN DE SERVICIO:|SOLICITUD N°|SOLICITUD)\s*(\d+)/i);
        if (matchOrden) resultado.ordenServicio = matchOrden[1];
        const matchNombre = texto.match(/NOMBRE(?: DEL)? SOLICITANTE\s*(.+?)\s*(?:TELÉFONO|DIRECCIÓN|SECTOR)/i);
        if (matchNombre) resultado.nombre = matchNombre[1].trim();
        const matchCC = texto.match(/CC:\s*([\d,.]+)/);
        if (matchCC) resultado.cc = matchCC[1].replace(/,/g, ''); 
        const matchTel = texto.match(/TELÉFONO\s*(\d+)/);
        if (matchTel) resultado.tel = matchTel[1];
        const matchBarrio = texto.match(/(?:SECTOR O BARRIO|DIRECCIÓN, SECTOR O BARRIO)\s*(.+?)\s*(?:DIRECCIÓN|OBSERVACIONES|FECHA)/i);
        if (matchBarrio) {
            resultado.barrio = matchBarrio[1].trim();
            resultado.direccion = matchBarrio[1].trim(); 
        }
        const matchDir = texto.match(/DIRECCIÓN UBICACIÓN[\s\S]*?(?:general\))\s*(.+?)\s*(?:FIRMA|OBSERVACIONES)/i);
        if(matchDir) resultado.direccion = matchDir[1].trim();
        return resultado;
    }

    function parsearActividades(texto) {
        let actividadesExtraidas = [];
        let lineas = texto.split('\n').map(l => l.trim()).filter(l => l !== "");
        
        const regexFechaUnica = /^\d{1,2}\/\d{2}\/\d{2,4}$/;
        for (let i = 0; i < lineas.length - 1; i++) {
            if (regexFechaUnica.test(lineas[i]) && regexFechaUnica.test(lineas[i+1])) {
                let fechaInicio = lineas[i];
                let fechaFin = lineas[i+1];
                
                let textoPrevio = (i > 0) ? lineas[i-1] : "";
                if (!textoPrevio || textoPrevio.includes("Fecha de inicio") || textoPrevio.includes("Nombre")) {
                    continue;
                }
                let tipoActividad = "";
                let descripcion = textoPrevio;
                let matchTipo = textoPrevio.match(/^([A-ZÁÉÍÓÚÑ0-9\s]{3,})\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ].*)$/);
                if (matchTipo) {
                    tipoActividad = matchTipo[1].trim();
                    descripcion = matchTipo[2].trim();
                } else {
                    tipoActividad = textoPrevio;
                }
                
                let mesStr = "";
                let partesFecha = fechaInicio.split("/");
                if (partesFecha.length === 3) {
                    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                    let numMes = parseInt(partesFecha[1], 10);
                    if (numMes >= 1 && numMes <= 12) {
                        mesStr = meses[numMes - 1];
                    }
                }
                let cargaWMatch = descripcion.match(/(\d+)\s*W/i);
                let cargaW = cargaWMatch ? cargaWMatch[1] : "";
                let tech = "";
                if (/led/i.test(descripcion)) tech += "LED ";
                if (/sodio/i.test(descripcion)) tech += "SODIO ";
                if (/roy alpha/i.test(descripcion)) tech += "Roy Alpha";
                tech = tech.trim();
                let tipoLuminariaFinal = tipoActividad;
                if (tech && !tipoActividad.toLowerCase().includes(tech.toLowerCase())) {
                    tipoLuminariaFinal += " " + tech;
                }
                let dirMatch = descripcion.match(/(?:sector|barrio|vereda|corregimiento|calle|cra|carrera|parque)\s+(?:de\s+)?([^,.]+)/i);
                let direccion = dirMatch ? dirMatch[0].trim() : "";
                actividadesExtraidas.push({
                    mes: mesStr,
                    fecha: fechaInicio,
                    tipoLuminaria: tipoLuminariaFinal.trim(),
                    cargaW: cargaW,
                    descripcion: descripcion,
                    direccion: direccion
                });
                i++;
            }
        }
        console.log("Actividades procesadas con éxito:", actividadesExtraidas);
        return actividadesExtraidas;
    }

    // ======== NUEVO: PARSEADOR DE TABLAS ========
    function parsearTabla(texto) {
        let datosExtraidos = [];
        let textoLimpio = texto.replace(/\n/g, ' '); 
        
        let filas = textoLimpio.split(/(?=\b\d{2}\/\d{2}\/\d{4}\b)/);

        for (let i = 0; i < filas.length; i++) {
            let fila = filas[i].trim();
            if (!fila.match(/^\d{2}\/\d{2}\/\d{4}/)) continue;

            let regex = /^(\d{2}\/\d{2}\/\d{4})\s+(\S+)\s+(\d+)\s+(\S+)\s+(\S+)\s+(-?\d+\.\d+\s*[, ]\s*-?\d+\.\d+|0)\s+([\s\S]*)$/i;
            let match = fila.match(regex);
            
            if (match) {
                let restoTexto = match[7] ? match[7].trim() : "";
                restoTexto = restoTexto.replace(/\s+[A-Za-zÁÉÍÓÚáéíóúñÑ]+\s*\d*$/, '').trim();

                let descripcion = restoTexto;
                let direccion = "";
                let matchDir = restoTexto.match(/\b(Parque|Sector|Ruta|Barrio|Vereda|Truchera|Corregimiento|Oficina|Pan de azúcar).*/i);
                
                if (matchDir) {
                    direccion = matchDir[0].trim();
                    descripcion = restoTexto.substring(0, restoTexto.indexOf(direccion)).trim();
                }

                datosExtraidos.push({
                    fecha: match[1],
                    tipo: match[2],
                    cargaW: match[3],
                    codigoLuminaria: match[4],
                    codigoApoyo: match[5],
                    coordenadas: match[6].replace(/\s+/g, ''), 
                    descripcion: descripcion || restoTexto, 
                    direccion: direccion
                });
            }
        }
        console.log("Datos de la Tabla extraídos:", datosExtraidos);
        return datosExtraidos;
    }

    // ======== ENVIADOR A GOOGLE SHEETS ========
    // Mantiene tu enlace exacto
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVV-0LV_HymvR1inJV65Nefpg-YOuO6vIVMuP1eWytuyTUFIv4ELLcQtgTIUM_L8jj/exec";
    
    async function procesarYEnviar(archivos, action) {
        statusDiv.innerText = "Procesando PDFs... por favor espera.";
        let datosFinales = [];
        
        for (let file of archivos) {
            try {
                let text = await extractTextFromPDF(file);
                if (action === 'pqr') {
                    datosFinales.push(parsearPQR(text));
                } else if (action === 'actividades') {
                    let acts = parsearActividades(text);
                    datosFinales = datosFinales.concat(acts);
                } 
                // NUEVO: Acción para procesar Tablas
                else if (action === 'Tabla') {
                    let tabs = parsearTabla(text);
                    datosFinales = datosFinales.concat(tabs);
                }
            } catch (err) {
                console.error("Error leyendo el PDF:", file.name, err);
                statusDiv.innerText = `Error intentando leer el PDF: ${file.name}. Revisa la consola.`;
                return; 
            }
        }
        
        console.log("Datos extraídos listos para enviar:", datosFinales);
        if (datosFinales.length === 0) {
            statusDiv.innerText = "Error: No se encontró información válida para extraer del PDF.";
            return;
        }
        statusDiv.innerText = `Enviando ${datosFinales.length} registros a la pestaña '${action}'...`;
        
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                body: JSON.stringify({ action: action, data: datosFinales })
            });
            
            const textResponse = await response.text(); 
            let result;
            try {
                result = JSON.parse(textResponse);
            } catch(e) {
                throw new Error("Google no devolvió un JSON válido. Revisa los permisos (Cualquier persona).");
            }
            
            if (result.success) {
                statusDiv.innerText = `¡Éxito! Datos guardados en la pestaña '${action}'.`;
                
                // Reiniciar interfaz según el tipo
                if(action === 'pqr') { archivosPQR = []; fileInputPQR.value = ""; btnProcesarPQR.disabled = true; }
                if(action === 'actividades') { archivosAct = []; fileInputAct.value = ""; btnProcesarAct.disabled = true; }
                // NUEVO: Reiniciar campos de Tabla
                if(action === 'Tabla') { archivosTabla = []; fileInputTabla.value = ""; btnProcesarTabla.disabled = true; }
                
            } else {
                statusDiv.innerText = `Error de Google Sheets: ${result.error}`;
                console.error("Error devuelto por Apps Script:", result.error);
            }
            
        } catch (error) {
            statusDiv.innerText = "Error de conexión: " + error.message;
            console.error("Error del Fetch:", error);
        }
    }

    // BOTONES DE EJECUCIÓN
    btnProcesarPQR.addEventListener('click', () => procesarYEnviar(archivosPQR, 'pqr'));
    btnProcesarAct.addEventListener('click', () => procesarYEnviar(archivosAct, 'actividades'));
    // NUEVO: Botón de Tabla
    btnProcesarTabla.addEventListener('click', () => procesarYEnviar(archivosTabla, 'Tabla'));

</script>
</body>
</html>
